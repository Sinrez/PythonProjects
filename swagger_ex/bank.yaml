openapi: 3.0.0
info:
  title: BankApi
  description: API для управления банковскими счетами и пользователями
  version: "1.0.0"
  contact:
    name: Bank Api support
    url: www.ob.ebank.ru
servers:
- url: https://openBank/ap/v1
tags:
- name: Счета
  description: Операции с банковскими счетами
- name: Пользователи
  description: Управление профилями пользователей

paths:
  /accounts/{accountId}: 
    get:
      tags:
        - Счета
      summary: Получить информацию о банковском счете
      description: Возвращает информацию о банковском счете по его идентификатору
      parameters:
        - name: accountId
          in: path
          required: true
          description: Уникальный идентификатор счета
          schema:
            type: integer
            minimum: 1
      responses: 
        '200':
          description: OK
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Account'
        '400':
          description: Плохой запрос
        '401':
          description: Неавторизован
        '403':
          description: Доступ запрещен
        '404':
          description: Не найдено
        '500':
          description: Внутренняя ошибка сервера
    
    patch:
      tags:
        - Счета
      summary: Частичное обновление счета
      description: |
        Частичное обновление информации о счете. 
        Только переданные поля будут обновлены.
      parameters:
        - name: accountId
          in: path
          required: true
          description: Уникальный идентификатор счета
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Счет успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Неверные данные в запросе
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
        '404':
          description: Счет не найден
        '500':
          description: Внутренняя ошибка сервера

    delete:
      tags:
        - Счета
      summary: Удалить счет
      description: |
        Удаление банковского счета.
        
        ⚠️ **Внимание**: Этот метод помечен как устаревший (deprecated). 
        Используйте изменение статуса счета на CLOSED через PATCH метод вместо полного удаления.
        
        Удаление возможно только для счетов со статусом RESERVED или нулевым балансом.
      deprecated: true
      parameters:
        - name: accountId
          in: path
          required: true
          description: Уникальный идентификатор счета
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Счет успешно удален (нет содержимого)
        '400':
          description: Неверный запрос (счет нельзя удалить)
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
        '404':
          description: Счет не найден
        '409':
          description: Конфликт (счет имеет баланс или активный статус)
        '500':
          description: Внутренняя ошибка сервера
                
  /accounts:
    post:
      tags:
        - Счета 
      summary: Создать новый счет
      description: Создание нового банковского счета для клиента
      requestBody: 
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/NewAccount'
      responses: 
        '201':
          description: Счет успешно создан
          content:
            application/json:
              schema: 
                type: object
                properties: 
                  accountId:
                    type: integer 
                    description: Уникальный идентификатор созданного счета
                    example: 11111343    
        '400':
          description: Плохой запрос
        '401':
          description: Неавторизован
        '403':
          description: Доступ запрещен
        '500':
          description: Внутренняя ошибка сервера
      
  /users-profile:
    put:
      tags:
        - Пользователи
      summary: Обновить информацию о пользователе
      description: Полное обновление профиля пользователя с основными параметрами
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Неверные данные в запросе
        '401':
          description: Не авторизован
        '403':
          description: Доступ запрещен
        '404':
          description: Пользователь не найден
        '500':
          description: Внутренняя ошибка сервера

components:
  schemas:
    Account:
      type: object
      properties: 
        accountId:
          type: integer 
          description: Уникальный идентификатор счета
          example: 11111343
        accountNumber:
          type: string 
          description: Номер счета
          example: "40700281000000000001"
        accountType:
          type: string
          description: Тип счета
          example: "DEBIT"
          enum: ["DEBIT", "CREDIT", "SAVINGS"]
        balance: 
          type: number
          format: double
          description: Баланс счета
          example: 2810.33
        currency:
          type: string
          description: Валюта счета
          example: "RUB"
          enum: ["RUB", "USD", "EUR"]
        status:
          type: string 
          description: Статус счета
          example: "ACTIVE"
          enum: 
            - ACTIVE
            - CLOSED
            - RESERVED
            - FROZEN
        createdAt:
          type: string
          format: date-time
          description: Дата создания счета
          example: "2025-01-15T14:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Дата последнего обновления
          example: "2025-12-20T10:15:30Z"
      required:
        - accountId
        - accountNumber
        - balance
        - status
        - createdAt

    NewAccount:
      type: object
      properties: 
        accountType:
          type: string
          description: Тип счета
          example: "DEBIT"
          enum: ["DEBIT", "CREDIT", "SAVINGS"]
        currency:
          type: string
          description: Валюта счета
          example: "RUB"
          enum: ["RUB", "USD", "EUR"]
        initialBalance: 
          type: number
          description: Начальный баланс счета
          minimum: 0
          example: 1000
        firstName: 
          type: string
          description: Имя владельца
          example: "Конь"
        middleName: 
          type: string
          description: Отчество владельца
          example: "Коневич"
        lastName: 
          type: string
          description: Фамилия владельца
          example: "Лошадкин"
      required:
        - accountType
        - currency
        - firstName
        - lastName

    AccountUpdate:
      type: object
      description: Объект для частичного обновления счета
      properties:
        status:
          type: string
          description: Новый статус счета
          enum: ["ACTIVE", "CLOSED", "RESERVED", "FROZEN"]
          example: "CLOSED"
        accountType:
          type: string
          description: Тип счета
          enum: ["DEBIT", "CREDIT", "SAVINGS"]
          example: "SAVINGS"
        currency:
          type: string
          description: Валюта счета
          enum: ["RUB", "USD", "EUR"]
          example: "USD"

    UserProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
          description: Имя
          minLength: 1
          maxLength: 50
          example: "Иван"
        lastName:
          type: string
          description: Фамилия
          minLength: 1
          maxLength: 50
          example: "Петров"
        email:
          type: string
          format: email
          description: Email
          example: "ivan.petrov@example.com"
        phone:
          type: string
          description: Телефон
          pattern: '^\+7\d{10}$'
          example: "+79161234567"
        birthDate:
          type: string
          format: date
          description: Дата рождения
          example: "1990-05-15"
        address:
          type: string
          description: Адрес
          maxLength: 200
          example: "ул. Ленина, д. 25, кв. 42, Москва, 101000"
        employment:
          type: string
          description: Место работы
          maxLength: 100
          example: "ООО 'Технологии'"
        position:
          type: string
          description: Должность
          maxLength: 50
          example: "Senior Developer"
        salary:
          type: number
          format: float
          description: Зарплата
          minimum: 0
          example: 450000.50
        preferredCurrency:
          type: string
          description: Предпочитаемая валюта
          enum: ["RUB", "USD", "EUR"]
          example: "RUB"
        language:
          type: string
          description: Язык интерфейса
          enum: ["ru", "en"]
          example: "ru"
        notificationSms:
          type: boolean
          description: SMS уведомления
          example: true
        notificationEmail:
          type: boolean
          description: Email уведомления
          example: false
        riskCategory:
          type: string
          description: Категория риска
          enum: ["LOW", "MEDIUM", "HIGH"]
          example: "LOW"
      required:
        - firstName
        - lastName
        - email
        - phone
        - address
        - language
        - notificationEmail
        
    UserProfileResponse:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
          example: "2025-12-20T10:15:30Z"
        profile:
          $ref: '#/components/schemas/UserProfileUpdate'
      required:
        - updatedAt
        - profile